<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị Landing Page — Decal/Tem nhãn</title>
<style>
  :root{
    --primary:#0D5FBE; --primary-light:#EAF2FD; --accent:#FF7A1A; --accent-dark:#E86400;
    --ink:#16233D; --ink-soft:#5B6B84; --bg-soft:#F5F8FC; --border:#E4E9F0;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg-soft);}
  button{font-family:inherit;cursor:pointer;}

  .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .topbar h1{font-size:15px;margin:0;font-weight:700;}
  .topbar .status{font-size:12px;color:var(--ink-soft);}
  .topbar .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--ink);}
  .btn:hover{border-color:var(--primary);color:var(--primary);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
  .btn-ghost{border-color:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{color:#E4572E;border-color:#F3C9BB;background:#FDF3F0;}

  .layout{display:grid;grid-template-columns:440px 1fr;height:calc(100vh - 53px);}
  .panel{overflow-y:auto;padding:20px;border-right:1px solid var(--border);background:#fff;}
  .preview-pane{background:#EDEFF3;padding:16px;overflow:hidden;}
  .preview-pane iframe{width:100%;height:100%;border:0;border-radius:10px;background:#fff;box-shadow:0 4px 20px rgba(22,35,61,.08);}

  details.section{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;}
  details.section summary{padding:13px 16px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--bg-soft);list-style:none;display:flex;align-items:center;justify-content:space-between;}
  details.section summary::-webkit-details-marker{display:none;}
  details.section summary::after{content:'+';font-size:16px;color:var(--ink-soft);}
  details.section[open] summary::after{content:'−';}
  details.section .content{padding:16px;}

  .f-row{margin-bottom:14px;}
  .f-row label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .f-row input[type="text"],.f-row input[type="url"],.f-row textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:13px;color:var(--ink);}
  .f-row textarea{resize:vertical;min-height:52px;}
  .f-row input:focus,.f-row textarea:focus{outline:none;border-color:var(--primary);}
  .f-row .hint{font-size:11px;color:#8B96A8;margin-top:4px;}
  .img-preview{width:100%;height:90px;object-fit:cover;border-radius:7px;margin-top:8px;border:1px solid var(--border);background:var(--bg-soft);}
  .upload-row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .upload-row input[type="file"]{flex:1;font-size:11.5px;padding:6px;border:1px dashed var(--border);border-radius:7px;background:#fff;min-width:160px;}
  .upload-status{font-size:11px;color:var(--ink-soft);}
  .upload-status.ok{color:#1D9A5B;}
  .upload-status.err{color:#E4572E;}

  .item-card{border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:12px;position:relative;background:var(--bg-soft);}
  .item-card .item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .item-card .item-top span{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .item-remove{font-size:11px;color:#E4572E;background:none;border:0;font-weight:600;}
  .item-remove:hover{text-decoration:underline;}
  .add-item-btn{width:100%;padding:10px;border:1.5px dashed var(--border);border-radius:9px;background:#fff;color:var(--primary);font-size:13px;font-weight:600;}
  .add-item-btn:hover{border-color:var(--primary);background:var(--primary-light);}
  .color-row{display:flex;align-items:center;gap:10px;}
  .color-row input[type="color"]{width:40px;height:34px;border:1px solid var(--border);border-radius:6px;padding:2px;}
  .price-row{display:flex;align-items:center;gap:8px;}
  .price-row input{width:100px !important;}

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;height:auto;}
    .panel{border-right:0;border-bottom:1px solid var(--border);}
    .preview-pane{height:70vh;}
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>🛠️ Quản trị Landing Page — Decal / Tem nhãn</h1>
  <span class="status" id="saveStatus">Sẵn sàng</span>
  <div class="actions">
    <button class="btn btn-ghost" id="resetBtn">Khôi phục mặc định</button>
    <button class="btn" id="draftBtn">💾 Lưu nội dung</button>
    <button class="btn btn-primary" id="exportBtn">⬇ Xuất file HTML</button>
  </div>
</div>

<div class="layout">
  <div class="panel" id="formPanel"></div>
  <div class="preview-pane"><iframe id="previewFrame" title="Xem trước landing page"></iframe></div>
</div>

  /* ---------------- Content persistence (server-based — hoạt động cả khi mở qua link deploy thật) ---------------- */
  function hasStorage(){ return typeof window.storage !== 'undefined' && window.storage; }

  // Lưu phần nội dung KHÔNG PHẢI giá (thương hiệu, hero, quy trình, lý do chọn, ảnh mẫu, CTA cuối)
  // lên server. silent=true: không báo lỗi ồn ào (dùng cho auto-save mỗi lần gõ chữ, tránh làm phiền
  // khi chưa nhập Admin Token). silent=false: báo rõ kết quả (dùng khi bấm nút lưu thủ công).
  function saveContentToServer(silent){
    var status = document.getElementById('saveStatus');
    var base = (content.apiBase || '').replace(/\/$/, '');
    if (!adminToken) {
      if (!silent) status.textContent = 'Cần nhập Admin Token ở mục "Kết nối Backend" trước khi lưu.';
      return;
    }
    var toSave = {
      brand: content.brand, phone: content.phone, apiBase: content.apiBase,
      hero: content.hero, process: content.process, why: content.why,
      gallery: content.gallery, finalCta: content.finalCta, footerNote: content.footerNote
    };
    fetch(base + '/api/content', {
      method: 'PUT',
      headers: {'Content-Type':'application/json', 'x-admin-token': adminToken},
      body: JSON.stringify(toSave)
    }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(){ status.textContent = 'Đã lưu lên server lúc ' + new Date().toLocaleTimeString('vi-VN'); })
      .catch(function(e){ if (!silent) status.textContent = 'Lỗi lưu: ' + e.message; });
  }

  // Tải nội dung đã lưu gần nhất từ server ngay khi mở trang — không cần Admin Token (chỉ đọc).
  // Nếu không gọi được (mở file rời file://, hoặc server chưa có gì lưu), dùng mặc định, không
  // chặn giao diện.
  function loadContentFromServer(){
    var base = (content.apiBase || '').replace(/\/$/, '');
    fetch(base + '/api/content').then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(data){
        var merged = defaultContent();
        Object.keys(data || {}).forEach(function(k){ if (data[k] != null) merged[k] = data[k]; });
        content = merged;
        renderAll();
      })
      .catch(function(){ renderAll(); });
  }

  /* ---------------- Preview + export ---------------- */
  function updatePreview(){
    clearTimeout(previewTimer);
    previewTimer = setTimeout(function(){
      document.getElementById('previewFrame').srcdoc = renderPageHTML(content);
    }, 200);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ saveContentToServer(true); }, 600);
  }

  function exportHTML(){
    var html = renderPageHTML(content);
    var blob = new Blob([html], {type:'text/html'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'decal-tem-nhan-landing.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------------- Form builders ---------------- */
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    for (var k in (attrs||{})) {
      if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ e.appendChild(c); });
    return e;
  }

  function fieldText(label, value, onInput, multiline){
    var wrap = el('div', {class:'f-row'});
    wrap.appendChild(el('label', {text:label}));
    var input = el(multiline ? 'textarea' : 'input', multiline ? {} : {type:'text'});
    input.value = value || '';
    input.addEventListener('input', function(){ onInput(input.value); updatePreview(); });
    wrap.appendChild(input);
    return wrap;
  }

  function fieldImage(label, value, onInput){
    var wrap = el('div', {class:'f-row'});
    wrap.appendChild(el('label', {text:label}));
    var input = el('input', {type:'url', placeholder:'https://...'});
    input.value = value || '';
    var img = el('img', {class:'img-preview', src: value || ''});
    img.onerror = function(){ img.style.opacity = '.3'; };
    input.addEventListener('input', function(){ onInput(input.value); img.src = input.value; img.style.opacity='1'; updatePreview(); });
    wrap.appendChild(input);

    var uploadRow = el('div', {class:'upload-row'});
    var fileInput = el('input', {type:'file', accept:'image/png,image/jpeg,image/webp,image/gif'});
    var uploadStatus = el('span', {class:'upload-status'});
    fileInput.addEventListener('change', function(){
      var file = fileInput.files[0];
      if (!file) return;
      var base = (content.apiBase || '').replace(/\/$/, '');
      if (!adminToken) { uploadStatus.textContent = 'Cần nhập Admin Token ở mục "Kết nối Backend" trước.'; uploadStatus.className = 'upload-status err'; return; }
      uploadStatus.textContent = 'Đang tải lên...'; uploadStatus.className = 'upload-status';
      var formData = new FormData();
      formData.append('image', file);
      fetch(base + '/api/upload', { method:'POST', headers:{'x-admin-token': adminToken}, body: formData })
        .then(function(r){ if (!r.ok) return r.json().then(function(e){ throw new Error(e.error || ('HTTP ' + r.status)); }); return r.json(); })
        .then(function(res){
          input.value = res.url;
          onInput(res.url);
          img.src = res.url; img.style.opacity = '1';
          updatePreview();
          uploadStatus.textContent = 'Đã tải lên thành công.'; uploadStatus.className = 'upload-status ok';
          fileInput.value = '';
        })
        .catch(function(e){ uploadStatus.textContent = 'Lỗi: ' + e.message; uploadStatus.className = 'upload-status err'; });
    });
    uploadRow.appendChild(fileInput);
    uploadRow.appendChild(uploadStatus);
    wrap.appendChild(uploadRow);

    wrap.appendChild(el('div', {class:'hint', text:'Tải ảnh trực tiếp từ máy (nút trên), hoặc dán URL ảnh có sẵn vào ô phía trên.'}));
    wrap.appendChild(img);
    return wrap;
  }

        rm.addEventListener('click', function(){ list.splice(i,1); renderAll(); updatePreview(); });
        top.appendChild(rm);
        card.appendChild(top);
        card.appendChild(fieldText(labelText, item[labelKey], function(v){ item[labelKey] = v; }));
        var vRow = el('div', {class:'f-row'});
        vRow.appendChild(el('label', {text:valueText}));
        var vInput = el('input', {type:'text'}); vInput.value = item[valueKey];
        vInput.addEventListener('input', function(){ item[valueKey] = parseFloat(vInput.value)||0; updatePreview(); });
        vRow.appendChild(vInput);
        card.appendChild(vRow);
        box.appendChild(card);
      });
      var addBtn = el('button', {class:'add-item-btn', text:'+ Thêm dòng'});
      addBtn.addEventListener('click', function(){ list.push(Object.assign({}, addDefault)); renderAll(); updatePreview(); });
      box.appendChild(addBtn);
      return box;
    }

    function renderShapeList(list){
      var box = el('div', {class:'f-row'});
      box.appendChild(el('label', {text:'Kiểu bế'}));
      box.appendChild(el('div', {class:'hint', text:'Mỗi kiểu bế thuộc 1 trong 3 nhóm giá bế thật (tra theo bậc số lượng từ file Excel): BETHUONG (bế thường — hình tròn/oval/bo góc), KETP (kẻ thành phẩm — chữ nhật/vuông thường), BEKHO (bế khó — hình phức tạp, hoặc tem có cạnh nhỏ hơn 2cm bất kể hình gì).'}));
      list.forEach(function(item, i){
        var card = el('div', {class:'item-card'});
        var top = el('div', {class:'item-top'});
        top.appendChild(el('span', {text:'Kiểu bế #' + (i+1)}));
        var rm = el('button', {class:'item-remove', text:'Xoá'});
        rm.addEventListener('click', function(){ list.splice(i,1); renderAll(); updatePreview(); });
        top.appendChild(rm);
        card.appendChild(top);
        card.appendChild(fieldText('Tên kiểu bế', item.label, function(v){ item.label = v; }));
        var selRow = el('div', {class:'f-row'});
        selRow.appendChild(el('label', {text:'Nhóm giá bế'}));
        var sel = el('select');
        ['BETHUONG', 'KETP', 'BEKHO'].forEach(function(opt){
          var o = el('option', {value: opt, text: opt});
          if (item.nhomBe === opt) o.setAttribute('selected', 'true');
          sel.appendChild(o);
        });
        sel.value = item.nhomBe || 'BETHUONG';
        sel.addEventListener('change', function(){ item.nhomBe = sel.value; updatePreview(); });
        selRow.appendChild(sel);
        card.appendChild(selRow);
        box.appendChild(card);
      });
      var addBtn = el('button', {class:'add-item-btn', text:'+ Thêm kiểu bế'});
      addBtn.addEventListener('click', function(){ list.push({label:'Kiểu mới', nhomBe:'BETHUONG'}); renderAll(); updatePreview(); });
      box.appendChild(addBtn);
      return box;
    }

    c8.appendChild(renderShapeList(content.pricing.shapes));
    c8.appendChild(renderNumberList('Số mặt', content.pricing.sides, 'label', 'Tên lựa chọn', 'mult', 'Hệ số nhân (1 = không đổi)', 0.05, {label:'Lựa chọn mới', mult:1}));
    c8.appendChild(renderNumberList('Loại màng', content.pricing.laminate, 'label', 'Tên lựa chọn', 'mult', 'Hệ số nhân', 0.05, {label:'Lựa chọn mới', mult:1}));
    c8.appendChild(renderNumberList('Thời gian giao', content.pricing.rush, 'label', 'Tên lựa chọn', 'mult', 'Hệ số nhân', 0.05, {label:'Lựa chọn mới', mult:1}));

    var promoBox = el('div', {class:'f-row'});
    promoBox.appendChild(el('label', {text:'Bậc khuyến mãi theo số lượng'}));
    content.pricing.promoTiers.forEach(function(t, i){
      var card = el('div', {class:'item-card'});
      var top = el('div', {class:'item-top'});
      top.appendChild(el('span', {text:'Bậc #' + (i+1)}));
      var rm = el('button', {class:'item-remove', text:'Xoá'});
      rm.addEventListener('click', function(){ content.pricing.promoTiers.splice(i,1); renderAll(); updatePreview(); });
      top.appendChild(rm);
      card.appendChild(top);
      var row = el('div', {class:'price-row'});
      var qInput = el('input', {type:'text'}); qInput.value = t.minQty; qInput.placeholder = 'Số lượng từ';
      qInput.addEventListener('input', function(){ t.minQty = parseInt(qInput.value,10)||0; updatePreview(); });
      var rInput = el('input', {type:'text'}); rInput.value = Math.round(t.rate*100); rInput.placeholder = '% giảm';
      rInput.addEventListener('input', function(){ t.rate = (parseFloat(rInput.value)||0)/100; updatePreview(); });
      row.appendChild(qInput); row.appendChild(el('span',{text:'cái trở lên, giảm'})); row.appendChild(rInput); row.appendChild(el('span',{text:'%'}));
      card.appendChild(row);
      promoBox.appendChild(card);
    });
    var addTier = el('button', {class:'add-item-btn', text:'+ Thêm bậc khuyến mãi'});
    addTier.addEventListener('click', function(){ content.pricing.promoTiers.push({minQty:100, rate:0}); renderAll(); updatePreview(); });
    promoBox.appendChild(addTier);
    c8.appendChild(promoBox);

    var codeBox = el('div', {class:'f-row'});
    codeBox.appendChild(el('label', {text:'Mã giảm giá (demo, tự xử lý ở phía trình duyệt)'}));
    var codeRow = el('div', {class:'price-row'});
    var codeInput = el('input', {type:'text'}); codeInput.value = content.pricing.promoCode.code;
    codeInput.addEventListener('input', function(){ content.pricing.promoCode.code = codeInput.value; updatePreview(); });
    var codeRateInput = el('input', {type:'text'}); codeRateInput.value = Math.round(content.pricing.promoCode.rate*100);
    codeRateInput.addEventListener('input', function(){ content.pricing.promoCode.rate = (parseFloat(codeRateInput.value)||0)/100; updatePreview(); });
    codeRow.appendChild(codeInput); codeRow.appendChild(el('span',{text:'giảm thêm'})); codeRow.appendChild(codeRateInput); codeRow.appendChild(el('span',{text:'%'}));
    codeBox.appendChild(codeRow);
    codeBox.appendChild(el('div', {class:'hint', text:'Đây là mã demo xử lý bằng JS, chưa nối với hệ thống kiểm mã thật.'}));
    c8.appendChild(codeBox);

    s8.appendChild(c8); panel.appendChild(s8);

    updatePreview();
  }

  /* ---------------- Toolbar actions ---------------- */
  document.getElementById('exportBtn').addEventListener('click', exportHTML);
  document.getElementById('draftBtn').addEventListener('click', function(){
    saveContentToServer(false);
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!confirm('Khôi phục toàn bộ nội dung về mặc định? Thao tác này sẽ mất các chỉnh sửa hiện tại (kể cả bản đã lưu trên server, nếu sau đó bạn tiếp tục sửa và lưu lại).')) return;
    content = defaultContent();
    renderAll();
  });

  loadContentFromServer();
})();
</script>

</body>
</html>
